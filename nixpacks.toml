[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "git", "nodejs", "nodePackages.pnpm"]

[phases.build]
cmds = [
  # Verifica que openssl esté cargado (mysqlnd lo necesita para caching_sha2_password de MySQL 8/9).
  # Falla el build aquí con un mensaje claro en vez de morir luego en 'migrate'.
  "php -m | grep -qi openssl || (echo 'ERROR: la extension openssl de PHP no esta cargada' && php -m && exit 1)",
  # Reintenta la descarga via dist (API de GitHub) y, si falla por 504/rate-limit,
  # cae a clonar por git (--prefer-source), que no depende de api.github.com.
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || composer install --no-dev --optimize-autoloader --no-interaction --prefer-source",
  # NO se cachea la config en build: en este punto los secretos (APP_KEY, DB_*, etc.)
  # no estan disponibles y se hornearian valores nulos en bootstrap/cache/config.php.
  # config:cache se ejecuta en 'start', cuando las variables de entorno ya estan inyectadas.
  # route:cache y view:cache no dependen de secretos, asi que se quedan en build.
  "php artisan view:cache",
  "php artisan route:cache"
]

[start]
cmd = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
